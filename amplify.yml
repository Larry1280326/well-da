version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "PGHOST=$PGHOST" >> .env
        - echo "PGPORT=$PGPORT" >> .env
        - echo "PGDATABASE=$PGDATABASE" >> .env
        - echo "PGUSER=$PGUSER" >> .env
        - echo "PGPASSWORD=$PGPASSWORD" >> .env
        - echo "S3_REGION=$S3_REGION" >> .env
        - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env
        - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env
        - echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .env
        - echo "SES_ACCESS_KEY_ID=$SES_ACCESS_KEY_ID" >> .env
        - echo "SES_SECRET_ACCESS_KEY=$SES_SECRET_ACCESS_KEY" >> .env
        - echo "SES_SENDER_EMAIL=$SES_SENDER_EMAIL" >> .env
        - echo "SES_REGION=$SES_REGION" >> .env
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
